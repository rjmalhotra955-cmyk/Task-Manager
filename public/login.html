<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./normalize.css" />
    <link rel="stylesheet" href="./main.css" />
    <title>Task Manager || Login</title>
  </head>
  <body>
    <form class="task-form" id="auth-form">
      <h4 id="form-title">login</h4>
      <div class="form-control auth-fields">
        <input type="text" id="name" placeholder="name" style="display: none" />
        <input type="email" id="email" placeholder="email" required />
        <input type="password" id="password" placeholder="password (min 6 characters)" required />
        <button type="submit" class="btn submit-btn" id="submit-btn">login</button>
      </div>
      <div class="form-alert"></div>
      <p class="auth-switch">
        <span id="switch-text">No account?</span>
        <a href="#" id="switch-link">Register</a>
      </p>
    </form>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
    <script>
      // already logged in → go to the app
      if (localStorage.getItem('token')) window.location.href = 'index.html'

      const form = document.getElementById('auth-form')
      const nameInput = document.getElementById('name')
      const emailInput = document.getElementById('email')
      const passwordInput = document.getElementById('password')
      const title = document.getElementById('form-title')
      const submitBtn = document.getElementById('submit-btn')
      const switchText = document.getElementById('switch-text')
      const switchLink = document.getElementById('switch-link')
      const alertDOM = document.querySelector('.form-alert')

      let isLogin = true

      switchLink.addEventListener('click', (e) => {
        e.preventDefault()
        isLogin = !isLogin
        nameInput.style.display = isLogin ? 'none' : 'block'
        nameInput.required = !isLogin
        title.textContent = isLogin ? 'login' : 'register'
        submitBtn.textContent = isLogin ? 'login' : 'register'
        switchText.textContent = isLogin ? 'No account?' : 'Already have an account?'
        switchLink.textContent = isLogin ? 'Register' : 'Login'
        alertDOM.style.display = 'none'
      })

      form.addEventListener('submit', async (e) => {
        e.preventDefault()
        const url = isLogin ? '/api/v1/auth/login' : '/api/v1/auth/register'
        const body = { email: emailInput.value, password: passwordInput.value }
        if (!isLogin) body.name = nameInput.value

        try {
          const { data } = await axios.post(url, body)
          localStorage.setItem('token', data.token)
          localStorage.setItem('name', data.user.name)
          window.location.href = 'index.html'
        } catch (error) {
          alertDOM.style.display = 'block'
          alertDOM.textContent =
            (error.response && error.response.data.msg) || 'Something went wrong'
        }
      })
    </script>
  </body>
</html>
